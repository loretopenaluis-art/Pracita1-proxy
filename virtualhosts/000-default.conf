<VirtualHost *:80>
    ServerName desconocido.invalid

    DocumentRoot /var/www/html/no-encontrado

    <Directory /var/www/html/no-encontrado>
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/default_error.log
    CustomLog ${APACHE_LOG_DIR}/default_access.log combined
</VirtualHost>