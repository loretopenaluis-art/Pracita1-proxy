<VirtualHost *:80>
    ServerName lamaldicion.com

    DocumentRoot /var/www/html/maldicion

    <Directory /var/www/html/maldicion>
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/lamaldicion_error.log
    CustomLog ${APACHE_LOG_DIR}/lamaldicion_access.log combined
</VirtualHost>
