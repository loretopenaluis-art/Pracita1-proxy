<VirtualHost *:80>
    ServerName trimes.com

    DocumentRoot /var/www/html/trimes

    <Directory /var/www/html/trimes>
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/trimes_error.log
    CustomLog ${APACHE_LOG_DIR}/trimes_access.log combined

    <Files "archivo-interno.dat">
        Require all denied
    </Files>
</VirtualHost>
